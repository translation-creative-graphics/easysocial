COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_DESC="Az áttelepítő átmásolja az EasySocial telepítését megelőzően létrejött új blogbejegyzéseket és annak hozzászólásait, továbbá létrehoz egy új hírfolyam bejegyzést az oldalon hozzáadott új blogbejegyzések és hozzászólások nevében."
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_NOTE="A szolgáltatás kizárólag az EasyBlog belső hozzászólásait másolja. "
COM_EASYSOCIAL_MIGRATORS_EASYSOCIAL_FIELDS="EasySocial Egyedi Mezők "
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS="JomSocial Események"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC="Az eszköz segítséget nyújt a JomSocial meglévő eseményeinek átmásolásában az EasySocial rendszerébe. Az áttelepítő szolgáltatás egyaránt importálja a <code>üzenőfali tevékenységeket</code>,<code>az ismétlődő eseményeket</code>(mint egyéni eseményt) és a<code>résztvevő vendégeket</code>."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="JomSocial Csoportok"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Az eszköz segítséget nyújt a JomSocial meglévő csoportjainak átmásolásában az EasySocial rendszerébe. Az áttelepítő szolgáltatás egyaránt importálja a <code>megbeszéléseket</code>,<code>közleményeket</code> és a csoportok <code>tagjait</code>."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="JomSocial Felhasználók"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Az eszköz segítséget nyújt a JomSocial meglévő felhasználóinak átmásolásában az EasySocial rendszerébe. Az áttelepítő szolgáltatás egyaránt importálja az <code>egyéni profilokat</code>,<code>egyéni mezőket</code>,<code>felhasználói fényképeket</code>, a <code>felhasználók adatvédelmi beállításait</code>, a <code>felhasználói pontegyenlegeket</code>, az <code>ismerősöket</code>,<code>üzeneteket</code> továbbá a <code>felhasználók Igazolványképeit</code>."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="JomSocial Videók"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC="Az eszköz segítséget nyújt a JomSocial meglévő <code>felhasználói-</code> és <code>csoportvideók</code> átmásolásában az EasySocial rendszerébe. Az áttelepítő szolgáltatás egyaránt importálja azok<code>hozzászólásait</code>."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="A csoportvideók áttelepítéséhez, kérjük először győződj meg arról, hogy lefuttattad a <code>JomSocial Csoportok</code> átmásolását a jelenlegi áttelepítési folyamat folytatása előtt. Ennek elmulasztása esetén a csoportvideók felhasználói videókként kerülnek átmásolásra."
