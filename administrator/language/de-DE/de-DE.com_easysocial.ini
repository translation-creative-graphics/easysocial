COM_ES_PAGES_SETTINGS_HIDE_SUBCATEGORIES_DESC="Bei aktiver Einstellung zeigt die herkömmliche Kategorieauswahl in Schritt 1 nur Hauptkategorien – die Option „Unterkategorien anzeigen“ entfällt, sodass beim Anlegen einer Seite keine Unterkategorien gewählt werden können."
COM_ES_PAGES_SETTINGS_NEARBY_PAGES_RADIUS="Standardradius für Seiten in der Nähe"
COM_ES_PAGES_SETTINGS_NEARBY_PAGES_RADIUS_DESC="Legt den Standardradius (in Meilen) für Seiten in der Nähe fest"
COM_ES_PAGES_SHOW_ADDRESS_CHIPS="Tags für Bezirk/Gemeinde der Adresse anzeigen"
COM_ES_PAGES_SHOW_ADDRESS_CHIPS_HELP="Bei aktiver Einstellung erscheint der ermittelte Bezirk bzw. die Gemeinde jeder Seite als Tag auf ihrer Karte in der Listenansicht. Deaktiviere die Option, um Wiederholungen auf einer bereits nach einem Ort gefilterten Übersichtsseite zu vermeiden."
COM_ES_PAGES_SHOW_CATEGORY_CHIPS="Kategorie-Tags anzeigen"
COM_ES_PAGES_SHOW_CATEGORY_CHIPS_HELP="Bei aktiver Einstellung erscheinen die zugeordneten Kategorien jeder Seite – einschließlich zusätzlicher Mehrfachkategorien – als Tags auf ihrer Karte in der Listenansicht. Deaktiviere die Option, um die Ansicht bei Seiten mit vielen Kategorien übersichtlich zu halten."
COM_ES_PAGES_SHOW_COMBO_FILTER="Kombinierte Suche anzeigen"
COM_ES_PAGES_SHOW_COMBO_FILTER_HELP="Bei aktiver Einstellung erscheint über der Karte auf der Seitenübersicht eine kombinierte Suchleiste für Kategorie bzw. Name und Region. Deaktiviere die Option, um sie für diesen Bereich auszublenden."
COM_ES_PAGES_SHOW_MAP="Karte anzeigen"
COM_ES_PAGES_SHOW_MAP_HELP="Bei aktiver Einstellung erscheint über der Seitenliste eine gruppierte Karte mit den Standorten der Seiten."
COM_ES_PAGES_SHOW_REGION_CHIPS="Regions-Tags anzeigen"
COM_ES_PAGES_SHOW_REGION_CHIPS_HELP="Bei aktiver Einstellung erscheinen die Mehrfachregionen jeder Seite als Tags auf ihrer Karte in der Listenansicht. Deaktiviere die Option, um die Ansicht bei Seiten mit vielen Regionen übersichtlich zu halten."
COM_ES_VIDEOS_BUNNY_PROCESSING_INFO="Die Datei wird zur Kodierung auf das Bunny CDN hochgeladen und in unserer Mediathek gespeichert. Einzelheiten dazu findest du in unserer Datenschutzerklärung."
