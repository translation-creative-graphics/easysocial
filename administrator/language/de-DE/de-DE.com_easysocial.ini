COM_ES_VIDEOS_SETTINGS_BUNNY_NET_AUTOPLAY_VIEWPORT_DESC="Startet die automatische Wiedergabe nur, wenn das Video im Sichtbereich liegt (zu mindestens 50 % sichtbar). Beim Herausscrollen wird pausiert."
