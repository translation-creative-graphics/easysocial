COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC=" Dieser Migrator kann die Events aus JomSocial nach EasySocial migrieren. Die Migration umfasst <code>Pinnwand Aktivitäten</code>,<code>Wiederholungen des Events</code>(als individuelle Events) und <code>Teilnehmer</code> des Events."
