COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Dieser Migrator kann alle deine vorhanden JomSocial Daten nach EasySocial migrieren. Die Migration umfasst <code>Benutzerdefinierte Profile</code>,<code>Benutzerdefinierte Felder</code>,<code>Benutzer Fotos</code>,<code>Privatsphäre der Benutzer</code>,<code>Freunde</code>,<code>Nachrichten</code> nd <code>Profilbilder</code> von JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="JomSocial-Videos"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC=" Dieser Migrator kann <code>Benutzer</code> und <code>Gruppen</code> Videos von JomSocial nach EasySocial migrieren. Diese Migration wird auch die <code>Kommentare</code> der Videos übernehmen."
