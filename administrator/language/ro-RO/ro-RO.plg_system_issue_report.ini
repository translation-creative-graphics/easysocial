PLG_ISSUE_REPORT_WORKFLOWS_HELP_TITLE="Cum se scrie un flux"
PLG_ISSUE_REPORT_WORKFLOWS_HELP="Un status pe rând, în ordine: <code>cheie | Etichetă | fază | cine | opțiuni</code>.<br>Faza dă culoarea pe hartă: <b>open</b> (roșu), <b>progress</b> (portocaliu), <b>restored</b> (albastru), <b>fixed</b> (verde, închide sesizarea), <b>closed</b> (gri, închisă fără rezolvare).<br>Cine îl poate pune: <b>operator</b>, <b>moderator</b>, <b>author</b> (separate prin virgulă).<br>Opțiuni: <b>notify</b> (scrie statusul în postare, cu notificare), <b>eta</b> (cere ora estimată), <b>reason</b> (nota e obligatorie), <b>late:180</b> (întârziată după 180 de minute).<br>Primul rând e statusul de pornire. Ex.: <code>drum | Echipă pe drum | progress | operator | notify,eta,late:180</code>"
