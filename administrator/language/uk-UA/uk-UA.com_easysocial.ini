COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_DESC="Мігратор зможе переносити нові дописи та відповіді в Kunena, які були створені до встановлення EasySocial. Ця служба створить нову стрічку активності на сайті. Аватар користувача в Kunena також буде перенесений."
