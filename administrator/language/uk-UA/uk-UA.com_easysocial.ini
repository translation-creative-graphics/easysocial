COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_DESC="Мігратор зможе переносити нові дописи та коментарі в блогах, створені до встановлення EasySocial. Ця служба буде генерувати нову активність стрічки для нових дописів і коментарів у блозі."
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_NOTE="Перенести тільки вбудовані коментарі в EasyBlog."
COM_EASYSOCIAL_MIGRATORS_EASYSOCIAL_FIELDS="Користувацькі поля EasySocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS="Заходи JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC=" Цей мігратор може перенести заходи з JomSocial в EasySocial. Ця служба також перенесе <code>стрічку активності</code>, <code>повторювані заходи</code> (індивідуальні заходи) та <code>відповідальних</code> за заходи."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="Групи JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC=" Цей мігратор може перенести групи з JomSocial в EasySocial. Ця служба також перенесе <code>обговорення</code>, <code>бюлетені</code> та <code>учасників</code> з груп."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="Користувачі JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Цей мігратор може перенести всі дані вашого існуючого користувача з JomSocial в EasySocial. Ця служба також перенесе <code>Користувацькі профілі</code>,<code>Користувацькі поля</code>,<code>Фотографії користувача</code>,<code> Конфіденційність користувача</code>, <code>Бали користувача</code>,<code>Друзі</code>, <code>Розмови</code> та <code>Аватари користувача</code> з JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="Відео JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC=" Цей мігратор може перенести відео <code>користувачів</code> і <code>груп</code> з JomSocial до EasySocial. Ця служба може також перенести <code>коментарі</code> до відео."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="Щоб перенести відео групи, спочатку переконайтеся, що ви запустили <code>JomSocial Groups</code>, перш ніж продовжити міграцію відео. В іншому випадку групові відео будуть перенесені як відео користувача."
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS="Стрічка реєстрації Joomla"
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS_DESC="Мігратор перенесе попередні реєстрації користувачів з вашого сайту Joomla до установки EasySocial. Він створить новий елемент стрічки на вашому сайті для реєстрації користувачів."
