COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS_DESC="Перш ніж ми почнемо процес міграції, вам потрібно буде допомогти нам визначити, які налаштовувані поля ви бажаєте зіставити з EasySocial. Це гарантує, що дані полів, що налаштовуються, будуть правильно перенесені до EasySocial."
COM_EASYSOCIAL_MIGRATORS_CB="Профілі Community Builder"
