COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS="Ligue (Bind) os Campos Personalizados"
COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS_DESC="Antes de iniciar o processo de migração terá que nos ajudar a identificar quais os campos personalizados que gostaria de mapear de volta para o EasySocial. Isto garante que os dados dos campos personalizados são corretamente migrados para EasySocial."
COM_EASYSOCIAL_MIGRATORS_CB="Perfis Community Builder"
COM_EASYSOCIAL_MIGRATORS_CB_DESC="Este migrador será capaz de migrar os dados dos seus utilizadores existentes em Community Builder para EasySocial."
COM_EASYSOCIAL_MIGRATORS_CB_FIELDS="Campos Personalizados Community Builder"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS="Fluxos EasyBlog"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_DESC="O migrador será capaz de migrar novas publicações e comentários que foram criados antes da instalação do EasySocial. Este serviço de migração irá gerar um novo fluxo de atividade para novas publicações e comentários."
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_NOTE="Apenas migra os comentários embutidos no EasyBlog."
COM_EASYSOCIAL_MIGRATORS_EASYSOCIAL_FIELDS="Campos Personalizados EasySocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS="Eventos JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC="Este migrador será capaz de migrar eventos de JomSocial para EasySocial. Este serviço de migração também irá migrar <code>actividades de parede</code>,<code>eventos recorrentes</code> (como um evento individual) e <code> participantes</code> dos eventos."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="Grupos JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Este migrador será capaz de migrar grupos de JomSocial para EasySocial. Este serviço de migração também irá migrar <code>debates</code>, <code>boletins</code> e <code>membros</code> dos grupos."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="Utilizadores JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Este migrador será capaz de migrar todos os dados dos seus utilizadores de JomSocial para EasySocial. Este serviço de migração também irá migrar <code>Perfis Personalizados</code> , <code>Campos Personalizados</code>, <code>Fotos de utilizadores</code>, <code>Privacidade do utillizador</code>, <code>Pontos do Utilizador</code>, <code>Amigos</code>, <code>Conversas</code> e <code>Avatares do Utilizador</code> do JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="Vídeos JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC=" Este migrador será capaz de migrar <code>utilizadores</code> e vídeos de  <code>grupos</code> do JomSocial para o EasySocial. Este serviço de migração também irá migrar os <code>comentários</code> dos vídeos."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="Para migrar vídeos do grupo, certifique-se de que executou primeiro a migração <code>Grupos JomSocial</ code> antes de prosseguir com a migração de vídeo. Caso não o faça, os vídeos de grupo vão ser migrados como vídeos de utilizador."
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS="Fluxo de Registos Joomla"
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS_DESC="O migrador vai migrar os registos anteriores do utilizador no seu sítio Joomla antes da instalação de EasySocial. Ele irá gerar um novo item de fluxo no seu sítio para o registo do utilizador."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS="Kunena "
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_DESC="O migrador será capaz de migrar novas mensagens e respostas no Kunena, criadas antes da instalação do EasySocial. Este serviço de migração irá gerar novas atividades de fluxo no sítio. O avatar do utilizador no Kunena também será migrado."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_NOTE="Apenas migra publicações no fórum, respostas e avatares."
