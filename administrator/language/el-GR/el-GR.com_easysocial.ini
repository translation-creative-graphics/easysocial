COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS="Σύνδεση προσαρμοσμένων πεδίων"
COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS_DESC="Πριν ξεκινήσουμε με τη διαδικασία μετεγκατάστασης, θα πρέπει να μας βοηθήσετε να προσδιορίσουμε ποια προσαρμοσμένα πεδία θέλετε να το αντιστοιχίσετε ξανά στο EasySocial. Αυτό διασφαλίζει ότι τα δεδομένα προσαρμοσμένων πεδίων μεταφέρονται σωστά στο EasySocial."
COM_EASYSOCIAL_MIGRATORS_CB="Προφίλ δημιουργού κοινότητας"
COM_EASYSOCIAL_MIGRATORS_CB_DESC="Αυτός ο μεταναστευτής θα μπορεί να μετεγκαταστήσει τα υπάρχοντα δεδομένα του χρήστη σας από το Community Builder στο EasySocial."
COM_EASYSOCIAL_MIGRATORS_CB_FIELDS="Προσαρμοσμένα πεδία δημιουργού κοινότητας"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS="Ροές EasyBlog"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_DESC="Ο μετανάστης θα μπορεί να μετεγκαταστήσει νέες αναρτήσεις ιστολογίου και σχόλια που δημιουργήθηκαν πριν από την εγκατάσταση του EasySocial. Αυτή η υπηρεσία μετεγκατάστασης θα δημιουργήσει μια νέα δραστηριότητα ροής για νέες αναρτήσεις και σχόλια ιστολογίου."
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_NOTE="Μετεγκαθιστά μόνο τα ενσωματωμένα σχόλια στο EasyBlog."
COM_EASYSOCIAL_MIGRATORS_EASYSOCIAL_FIELDS="Προσαρμοσμένα πεδία EasySocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS="JomSocial Εκδηλώσεις"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC=" Αυτός ο μεταεγκαταστατής θα έχει τη δυνατότητα μετεγκατάστασης συμβάντων από το JomSocial στο EasySocial. Αυτή η υπηρεσία μετεγκατάστασης θα μεταφέρει επίσης τις <code> δραστηριότητες τοίχου </code>, <code> επαναλαμβανόμενα συμβάντα </code> (ως μεμονωμένο συμβάν) και <code> συνοδούς </code> από τις εκδηλώσεις."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="JomSocial Groups"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC=" Αυτός ο μετανάστης θα μπορεί να μεταφέρει ομάδες από το JomSocial στο EasySocial. Αυτή η υπηρεσία μετεγκατάστασης θα μεταφέρει επίσης τα <code> συζητήσεις </code>, <code> buletins </code> και <code> μέλη </code> από τις ομάδες."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="JomSocial χρήστες"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Αυτός ο μεταναστευτής θα μπορεί να μετεγκαταστήσει όλα τα υπάρχοντα δεδομένα του χρήστη σας από το JomSocial στο EasySocial. Αυτή η υπηρεσία μετεγκατάστασης θα μεταφέρει επίσης <code> Custom Profiles </code>, <code> Custom Fields </code>, <code> Φωτογραφίες χρήστη </code>, <code> Απόρρητο χρήστη </code>, <code> Σημεία χρήστη </code>, <code> Φίλοι </code>, <code> Συνομιλίες </code> και <code> Avatar χρήστη </code> από το JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="JomSocial βίντεο"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC=" Αυτός ο μεταναστευτής θα μπορεί να μεταφέρει βίντεο <code> χρηστών </code> και <code> ομάδων </code> από το JomSocial στο EasySocial. Αυτή η υπηρεσία μετεγκατάστασης θα μεταφέρει επίσης τα <code> σχόλια </code> από τα βίντεο."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="Για να μετεγκαταστήσετε τα βίντεο της ομάδας, βεβαιωθείτε ότι έχετε εκτελέσει πρώτα τη μετεγκατάσταση <code> JomSocial Groups </code> προτού προχωρήσετε στη μετεγκατάσταση βίντεο. Εάν δεν το κάνετε αυτό, θα γίνει η μετεγκατάσταση των ομαδικών βίντεο ως βίντεο του χρήστη."
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS="Ροή εγγραφής Joomla"
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS_DESC="Ο μετανάστης θα μετεγκαταστήσει προηγούμενες εγγραφές χρηστών από τον ιστότοπό σας στο Joomla πριν από την εγκατάσταση του EasySocial. Θα δημιουργήσει ένα νέο στοιχείο ροής στον ιστότοπό σας για εγγραφές χρηστών."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS="Κουνένα"
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_DESC="Ο μετανάστης θα μπορεί να μετεγκαταστήσει νέες αναρτήσεις και απαντήσεις στο Kunena που δημιουργήθηκαν πριν από την εγκατάσταση του EasySocial. Αυτή η υπηρεσία μετεγκατάστασης θα δημιουργήσει νέες δραστηριότητες ροής στον ιστότοπο. Επίσης, θα γίνει μετεγκατάσταση του avatar χρήστη στο Kunena."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_NOTE="Μετεγκαθιστά μόνο δημοσιεύσεις, απαντήσεις και είδωλα φόρουμ."
COM_EASYSOCIAL_MIGRATOR_BACKUP_EXISTING_DB="Δημιουργήστε ένα αντίγραφο ασφαλείας της υπάρχουσας βάσης δεδομένων σας για κάθε περίπτωση."
