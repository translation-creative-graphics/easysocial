COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC="Ten migrator pozwala przenieść zdarzenia z JomSocial do EasySocial. Migracja także przeniesie   <code>wpisy na ścianie</code>,<code>powtarzane zdarzenia</code>(w roli pojedynczych) oraz <code>uczestników</code> zdarzeń."
