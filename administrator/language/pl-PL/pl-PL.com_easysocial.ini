COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Ten migrator także przeniesie grupy z JomSocial do EasySocial. Zostaną przeniesione <code>dyskusje</code>, <code>ogłoszenia</code> oraz <code>uczestników</code> z grup."
