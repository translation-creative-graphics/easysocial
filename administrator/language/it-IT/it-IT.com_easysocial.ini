COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS="Associa campi personalizzati"
COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS_DESC="Prima di iniziare con il processo di migrazione, devi aiutarci a identificare quali campi personalizzati vuoi mappare anche in EasySocial. Ciò garantisce che i dati dei campi personalizzati vengano importati correttamente in EasySocial."
COM_EASYSOCIAL_MIGRATORS_CB="Profili Community Builder"
COM_EASYSOCIAL_MIGRATORS_CB_DESC="Il tool di migrazione sarà in grado di trasferire tutti i dati esistenti relativi agli utenti di Community Builder all'interno di EasySocial."
COM_EASYSOCIAL_MIGRATORS_CB_FIELDS="Campi personalizzati Community Builder"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS="Flussi EasyBlog"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_DESC="Il tool di migrazione sarà in grado di trasferire nuovi post e commenti creati prima dell'installazione di EasySocial. Il servizio di migrazione genererà un'attività nel flusso di aggiornamenti per nuovi post del blog e commenti."
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_NOTE="Migra soltanto i commenti inseriti direttamente in EasyBlog."
COM_EASYSOCIAL_MIGRATORS_EASYSOCIAL_FIELDS="Campi personalizzati EasySocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS="Eventi JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC="Questo migrante sarà in grado di migrare gli eventi da JomSocial a EasySocial. Questo servizio di migrazione migrerà anche il programma <code>Bacheca</code>,<code>eventi ricorrenti</code>(eventi individuali) e <code>assistenti</code> dall'evento."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="Gruppi JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Il tool di migrazione sarà in grado di trasferire i gruppi di JomSocial all'interno di EasySocial. Il servizio di migrazione trasferirà anche <code>discussioni</code>,<code>bollettini</code> e <code>membri</code> dei gruppi."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="Utenti JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Questa migrazione sarà in grado di migrare tutti i dati dell'utente esistenti da JomSocial su EasySocial. Questo servizio migrazione migrerà anche <code>Profili personalizzati</code>,<code>Campi personalizzati</code>,<code>foto utente</code>,<code>Privacy Utente</code>,<code>Punti Utente</code>,<code>Amicizie</code>,<code>Conversazioni</code> e <code>Avatar Utente</code> da JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="JomSocial Video"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC="Questo migrante sarà in grado di migrare <code>utenti</code>e <code> gruppi </code> video da JomSocial a EasySocial. Questo servizio di migrazione migrerà anche il programma <code> commenti </code>dai video."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="Per migrare i video del gruppo, assicuratevi di aver eseguito il programma <code>JomSocial Gruppi </code> prima di procedere con la migrazione video. In caso contrario, i video del gruppo saranno migrati come video dell'utente."
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS="Flusso registrazione Joomla"
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS_DESC="Il tool di migrazione sarà in grado di trasferire gli utenti Joomla registrati prima dell'installazione di EasySocial. Il servizio di migrazione genererà un nuovo elemento nel flusso di aggiornamenti del tuo sito per le registrazioni utente."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS="Kunena"
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_DESC="Il migrante sarà in grado di migrare nuovi post e risposte a Kunena che è stato creato prima dell'installazione di EasySocial. Questo servizio di migrazione genererà nuove attività di flusso di dati sul sito. Anche l'avatar utente di Kunena verrà migrato."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_NOTE="Migra solo messaggi di forum, risposte e avatar."
