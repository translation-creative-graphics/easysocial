COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC="Ce migrateur est en mesure de migrer les événements de JomSocial vers EasySocial. Ce service de migration migre également les <code>activités du mur</code>,<code> les événements récurrents </code> (comme événement individuel) et <code> en attentes </code> dans les événements."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="Groupes JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Cet outil migrera les groupes JomSocial vers EasySocial. Seront également migrés les <code>discussions</code>,<code>les bulletins</code> et <code>les utilisateurs</code> de ces groupes."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="Utilisateurs JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Cet outil migrera les données de vos utilisateurs JomSocial vers EasySocial. Seront également migrés: <code>les profils personnalisés</code>,<code>les champs personnalisés</code>,<code>les photos des utilisateurs</code>,<code>les règles de confidentialité</code>,<code>les Amis</code>,<code>les messageries</code> et <code> les photos de profils</code> JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="Vidéos JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC="Cet outil migrera les vidéos d'<code>utilisateurs</code> et de <code>groupes</code> de JomSocial vers EasySocial. Seront également migrés les <code>commentaires</code> de ces vidéos."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="Avant de migrer les vidéos de groupes, assurez-vous d'avoir migré les <code>groupes JomSocial</code>. Si ce n'est pas le cas, les vidéos de groupes seront migrées comme vidéos utilisateurs."
