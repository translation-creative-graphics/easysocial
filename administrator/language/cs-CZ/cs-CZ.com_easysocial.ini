COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS_DESC="Před zahájením procesu migrace, musíte vybrat vlastní pole zmapovaná z Community Builder. Tím zajistíte, že proces migrace do EasySocial proběhne správně."
COM_EASYSOCIAL_MIGRATORS_CB="Migrátor Community Builder Profilů"
COM_EASYSOCIAL_MIGRATORS_CB_DESC="Tento migrátor umožňuje přenést existující uživatelská data z Community Builder do EasySocial."
