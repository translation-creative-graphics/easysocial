COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS="Migrátor EasyBlog do Proudu"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_DESC="Tento migrátor umožňuje přenést nové příspěvky a jejich komentáře z blogu, vytvořené před instalací EasySocial. Budou generovány nové položky aktualit v proudu novinek."
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_NOTE="Lze migrovat pouze pokud používáte vestavěný komentářový systém EasyBlog."
COM_EASYSOCIAL_MIGRATORS_EASYSOCIAL_FIELDS="Vlastní Pole EasySocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS="Migrátor Událostí JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC="Tento migrátor vám umožní přenést události z JomSocial do EasySocial. Tento přenos bude aplikován na <code>příspěvky na nástěnce události</code>,<code>opakující se události</code>(jako individuální události) a <code>účastníky</code> z událostí."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="Migrátor Skupin JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Tento migrátor vám umožní přenést skupiny z JomSocial do EasySocial. Tento přenos bude aplikován na <code>diskuse</code>,<code>buletiny</code> a <code>členy</code> ze skupin."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="Migrátor Uživatelů JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Tento migrátor vám umožní přenést všechna existující uživatelská data z JomSocial do EasySocial. Tento přenos bude aplikován na <code>Vlastní Profily</code>,<code>Vlastní Pole</code>,<code>Fotografie Uživatele</code>,<code>Soukromí Uživatele</code>,<code>Kredity Uživatele</code>,<code>Přátele</code>,<code>Konverzace</code> a <code>Profilové Fota</code> z JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS="Migrátor Videí JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC="Tento migrátor vám umožní přenést videa z JomSocial do EasySocial. Tento přenos bude aplikován na <code>uživatele</code>,<code>skupiny</code> a <code>comentáře</code> z videí."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="Chcete-li přenést videa ze skupin, ujistěte se, že jste nejdříve spustili <code> Migrátor JomSocial Skupin </ code>, než budete pokračovat s migrací videí. Pokud tak neučiníte, způsobí to, že videa ze skupin budou  migrována jako videa uživatelů."
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS="Migrátor Joomla Registrací do Proudu"
COM_EASYSOCIAL_MIGRATORS_JOOMLA_REGISTRATIONS_DESC="Tento migrátor umožňuje přenést původní uživatele joomly, vytvořené před instalací EasySocial. Budou generovány nové položky o registraci v proudu novinek."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_DESC="Migrator bude moci přenést nové příspěvky a odpovědi v Kunena, který byl vytvořen před instalací EasySocial. Tato migrační služba vytvoří nové aktivity proudu novinek na stránkách. Uživatelské profilové foto v Kunena bude také migrován."
COM_EASYSOCIAL_MIGRATORS_KUNENA_STREAMS_NOTE="Migruje pouze příspěvky, odpovědi a profilové fota."
