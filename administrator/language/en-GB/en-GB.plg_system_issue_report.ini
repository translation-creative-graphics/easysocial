PLG_ISSUE_REPORT_WORKFLOWS_HELP_TITLE="How to write a workflow"
PLG_ISSUE_REPORT_WORKFLOWS_HELP="One status per line, in order: <code>key | Label | phase | who | options</code>.<br>The phase sets the map colour: <b>open</b> (red), <b>progress</b> (orange), <b>restored</b> (blue), <b>fixed</b> (green, closes the issue), <b>closed</b> (grey, ended without a fix).<br>Who may set it: <b>operator</b>, <b>moderator</b>, <b>author</b> (comma separated).<br>Options: <b>notify</b> (writes the status in the post, with a notification), <b>eta</b> (asks for an estimated time), <b>reason</b> (a note is required), <b>late:180</b> (overdue after 180 minutes).<br>The first line is the starting status. E.g. <code>drum | Crew on the way | progress | operator | notify,eta,late:180</code>"
