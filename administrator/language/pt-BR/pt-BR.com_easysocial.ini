COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS="Fluxo do EasyBlog"
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_DESC="O migrador será capaz de migrar novos posts e comentários que foi criado antes da instalação do EasySocial. Este serviço de migração gerará uma nova atividade de fluxo de novos posts e comentários."
COM_EASYSOCIAL_MIGRATORS_EASYBLOG_STREAMS_NOTE="Apenas migrar os comentários embutidos no EasyBlog."
COM_EASYSOCIAL_MIGRATORS_EASYSOCIAL_FIELDS="Campos Personalizados do EasySocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS="Eventos do JomSocial Events"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_EVENTS_DESC="Este migrador será capaz de migrar eventos de JomSocial até EasySocial. Este serviço de migração também migrará a <code>atividades do mural</code>,<code>eventos recorrentes</code>(como um evento individual) e <code>atendentes</code> dos eventos."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="Grupos do JomSocial Groups"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Este migrador será capaz de migrar grupos do JomSocial para o EasySocial. Este serviço de migração também migrará as <code>discussões</code>,<code>boletins</code> e <code>membros</code> dos grupos."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS="Usuários do JomSocial"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_USERS_DESC="Este migrador será capaz de migrar todos os dados do seu usuário existente do JomSocial para o EasySocial. Este serviço de migração também migrará <code>Perfis Personalizados</code>,<code>Campos Personalizados</code>,<code>Fotos de Usuários</code>,<code>Privacidade do Usuário</code>,<code>Pontos do Usuário</code>,<code>Amigos</code>,<code>Conversas</code> e <code>Avatares do Usuário</code> do JomSocial."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_DESC="Este migrador será capaz de migrar vídeos de <code>usuários</code> e <code>grupos</code> do JomSocial no EasySocial. Este serviço de migração também migrará o <code>comentários</code> dos vídeos."
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_VIDEOS_NOTE="Para migrar vídeos do grupo, tenha certeza de que você executou a migração dos <code>Grupos do JomSocial</code> primeiro antes de prosseguir com a migração de vídeo. Não fazer isso irá fazer com que os vídeos do grupo a ser migrado como vídeos do usuário."
