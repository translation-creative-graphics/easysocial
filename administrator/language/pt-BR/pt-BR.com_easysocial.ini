COM_EASYSOCIAL_MIGRATORS_BIND_CUSTOM_FIELDS_DESC="Antes de começar o processo de migração, você precisará nos ajudar a identificar quais os campos personalizados que você gostaria de mapeá-lo de volta para o EasySocial. Isso garante que os dados dos campos personalizados serão corretamente migrados para EasySocial."
