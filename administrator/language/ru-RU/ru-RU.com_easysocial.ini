COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS="JomSocial Группы"
COM_EASYSOCIAL_MIGRATORS_JOMSOCIAL_GROUPS_DESC="Это Мигратор может переместить группы из JomSocial в EasySocial. Это служба также будет переносить <code>обсуждения</code>, <code>бюллетени</code> и <code>участников</code> из групп."
