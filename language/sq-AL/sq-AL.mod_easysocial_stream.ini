MOD_EASYSOCIAL_STREAM_DESC="Moduli i transmetimit për EasySocial. Ju mund ta përdorni këtë modul për të shfaqur rrjedhën e aktiviteteve të kohëve të fundit nga faqja dhe lejoni përdoruesit të postojnë përditësime direkt nga moduli. Duhet të kihet parasysh se për rishikimin e historisë duhet të keni gjerësi minimale 480 piksele"
