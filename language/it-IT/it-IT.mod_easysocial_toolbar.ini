MOD_EASYSOCIAL_TOOLBAR_SHOW_NOTIFICATIONS_ICON="Mostra l'icona Notifiche"
MOD_EASYSOCIAL_TOOLBAR_SHOW_NOTIFICATIONS_ICON_DESC="Se questa opzione è abilitata, il modulo mostrerà l'icona Notifiche nella toolbar."
MOD_EASYSOCIAL_TOOLBAR_SHOW_PROFILE="Mostra profilo"
MOD_EASYSOCIAL_TOOLBAR_SHOW_PROFILE_DESC="Se questa opzione è abilitata, il modulo mostrerà nome e avatar dell'utente nella toolbar."
MOD_EASYSOCIAL_TOOLBAR_SHOW_SEARCH="Mostra Cerca"
