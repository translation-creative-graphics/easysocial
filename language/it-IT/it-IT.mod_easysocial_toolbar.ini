MOD_EASYSOCIAL_TOOLBAR_DESC="Questo modulo visualizza la bella barra degli strumenti di notifica per EasySocial sul sito. Questo modulo richiede almeno <b> 800px </b> di larghezza minima in modo che la barra degli strumenti si adatti bene."
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES="Mostra sulle pagine di EasySocial"
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES_DESC="Se questa opzione è disabilitata, il modulo non sarà visibile sulle pagine di EasySocial."
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION="Popbox collisione"
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION_DESC="Ruota la posizione del popbox quando la posizione originale viene tagliata dal bordo della finestra del browser ."
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE_DESC="Se questa opzione è abilitata, il modulo adatterà il layout della toolbar in base alla larghezza del modulo."
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON="Mostra l'icona Conversazioni"
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON_DESC="Se questa opzione è abilitata, il modulo mostrerà l'icona Conversazioni nella toolbar."
MOD_EASYSOCIAL_TOOLBAR_SHOW_FRIENDS_ICON="Mostra l'icona Amici"
MOD_EASYSOCIAL_TOOLBAR_SHOW_FRIENDS_ICON_DESC="Se questa opzione è abilitata, il modulo mostrerà l'icona Amici nella toolbar."
MOD_EASYSOCIAL_TOOLBAR_SHOW_HOME_ICON="Mostra la icona Home"
MOD_EASYSOCIAL_TOOLBAR_SHOW_HOME_ICON_DESC="Se questa opzione è abilitata, il modulo mostrerà l'icona Home nella toolbar."
MOD_EASYSOCIAL_TOOLBAR_SHOW_LOGIN="Mostra l'icona Login"
