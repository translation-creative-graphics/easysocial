MOD_EASYSOCIAL_STREAM_DESC="Modulo di flusso per EasySocial. Puoi usare questo modulo per visualizzare le recenti attività di flusso e abilitare gli utenti a postare aggiornamenti direttamente dal modulo stesso. Fai attenzione che questo modulo richiederà una larghezza minima di 480 pixel."
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE="Visualizza Footer di streaming"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE_DESC="Il piè di pagina visualizzerà un messaggio che richiede all'utente di accedere o registrarsi per visualizzare altri elementi di stream"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Visualizza Form Aggiornamenti "
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="Questa opzione determina se il form dello stato dovrà essere visibile all'interno del modulo. Questa opzione dovrebbe essere abilitata solamente se il modulo avrà una larghezza minima di 480 pixels."
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY="Filtra per categoria di eventi"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY_DESC="Questa opzione consente di filtrare gli elementi di stream per categoria di eventi specifica"
MOD_EASYSOCIAL_STREAM_FILTER_BY="Filtra i flussi da"
MOD_EASYSOCIAL_STREAM_FILTER_BY_DESC="Riduci gli elementi del flusso tramite filtri specifici"
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="Vedere più feed dal vostro pannello di controllo"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY="Filtra per categoria di gruppo"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY_DESC="Questa opzione consente di filtrare gli elementi di stream per categoria di gruppi specifici"
MOD_EASYSOCIAL_STREAM_LOGIN="Effettua l'accesso per visualizzare altre voci del feed"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY="Filtra per categoria di pagina"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY_DESC="Questa opzione consente di filtrare elementi di stream per categoria di pagina specifica"
MOD_EASYSOCIAL_STREAM_TOTAL="Elementi totali"
MOD_EASYSOCIAL_STREAM_TOTAL_DESC="Determina il numero massimo delle voci attività da mostrare in questo modulo."
