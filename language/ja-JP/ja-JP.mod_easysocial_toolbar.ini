MOD_EASYSOCIAL_TOOLBAR_DESC="このモジュールは、EasySocial用の通知ツールバーを表示します。このモジュールには、ツールバーが正しく表示されるために、最低<b>800ピクセル</b>の幅が必要です。"
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES="\nEasySocialページ上に表示"
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES_DESC="これが無効になっている場合、モジュールはEasySocialページに表示されません。"
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION="Popboxの衝突"
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION_DESC="元の位置は、ブラウザウィンドウの端でクリップされるときにpopbox位置を反転します。"
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE="レスポンシブル"
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE_DESC="これが有効になっている場合、モジュールは、モジュール幅に応じて、ツールバーのレイアウトを自動調整します。"
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON="会話アイコンを表示"
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON_DESC="これが有効になっている場合は、モジュールが生成されたツールバーの会話のアイコンが表示されます。"
MOD_EASYSOCIAL_TOOLBAR_SHOW_FRIENDS_ICON="友達のアイコンを表示"
MOD_EASYSOCIAL_TOOLBAR_SHOW_FRIENDS_ICON_DESC="これが有効になっている場合は、モジュールが生成されたツールバーの友人のアイコンが表示されます。"
MOD_EASYSOCIAL_TOOLBAR_SHOW_HOME_ICON="ホームアイコンを表示"
MOD_EASYSOCIAL_TOOLBAR_SHOW_HOME_ICON_DESC="これが有効になっている場合は、モジュールが生成され、ツールバーのホームアイコンが表示されます。"
MOD_EASYSOCIAL_TOOLBAR_SHOW_LOGIN="ログインアイコンを表示"
MOD_EASYSOCIAL_TOOLBAR_SHOW_LOGIN_DESC="これが有効になっている場合、モジュールはロックアイコンを経由してログインフォームが表示されます。"
MOD_EASYSOCIAL_TOOLBAR_SHOW_NOTIFICATIONS_ICON="通知アイコンを表示"
MOD_EASYSOCIAL_TOOLBAR_SHOW_NOTIFICATIONS_ICON_DESC="これが有効になっている場合は、モジュールが生成されたツールバーの通知アイコンが表示されます。"
MOD_EASYSOCIAL_TOOLBAR_SHOW_PROFILE="プロフィールを表示"
MOD_EASYSOCIAL_TOOLBAR_SHOW_PROFILE_DESC="これが有効になっている場合は、モジュールが生成され、ツールバーの中に、ユーザーのアバターと名前が表示されます。"
MOD_EASYSOCIAL_TOOLBAR_SHOW_SEARCH="検索を表示"
MOD_EASYSOCIAL_TOOLBAR_SHOW_SEARCH_DESC="これが有効になっている場合、モジュールは、検索テキストボックスが表示されます。"
