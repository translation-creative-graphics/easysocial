MOD_EASYSOCIAL_STREAM_DESC="EasySocialのストリームラインモジュールです。これを使うことで、最近のアクティビティストリームラインを表示し、ユーザーにモジュールから直接投稿できるようにします。作業工程のアップデートフォームのために、最低480ピクセルの幅が必要です。"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE="ストリームフッターを表示"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE_DESC="ストリームラインの詳細を表示するには、ユーザーがサインインか登録が必要である旨のメッセージをフッターに表示します。"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="アップデートフォームを表示"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="ストーリーフォームがモジュール内で表示されるかどうかを設定します。モジュールの幅は最低480ピクセル必要です。"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY="イベントカテゴリーによるフィルター"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY_DESC="このオプションによって、特定イベントカテゴリーでストリーム項目のフィルター設定ができるようになります。"
MOD_EASYSOCIAL_STREAM_FILTER_BY="ストリームラインのフィルター設定："
MOD_EASYSOCIAL_STREAM_FILTER_BY_DESC="特定のフィルターによってストリーム項目を表示"
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="ダッシュボードから、更に投稿を表示する。"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY="グループカテゴリーによるフィルター"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY_DESC="このオプションによって、特定グループカテゴリーでストリーム項目のフィルター設定ができるようになります。"
MOD_EASYSOCIAL_STREAM_LOGIN="更に投稿を見るにはログインして下さい。"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY="ページカテゴリーによるフィルター"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY_DESC="このオプションによって、特定ページカテゴリーでストリーム項目のフィルター設定ができるようになります。"
MOD_EASYSOCIAL_STREAM_TOTAL="総項目"
MOD_EASYSOCIAL_STREAM_TOTAL_DESC="モジュール内に表示するストリームアイテムの最大数を決めます。"
