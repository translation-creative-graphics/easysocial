MOD_EASYSOCIAL_STREAM_DESC="Módulo de fluxo para o EasySocial. Pode usar este módulo para mostrar o fluxo de atividades recentes no sítio e permitir aos utilizadores publicar atualizações diretamente a partir do módulo. Tome nota de que para as atualizações da história funcionarem, necessita de uma largura mínima de 480 pixels."
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Mostrar Formulário de Atualizações"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="Esta opção determina se o formulário de história deve ser visível dentro do módulo. Só deve ser ativado quando o módulo tem uma largura mínima de 480 pixels"
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="Ver mais feeds do seu painel"
MOD_EASYSOCIAL_STREAM_LOGIN="Por favor, faça login para ver mais itens do feed"
MOD_EASYSOCIAL_STREAM_TOTAL="Total de Itens"
MOD_EASYSOCIAL_STREAM_TOTAL_DESC="Isto determina o número máximo de itens do fluxo de atividades mostrados no módulo."
