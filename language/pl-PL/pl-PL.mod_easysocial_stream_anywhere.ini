MOD_EASYSOCIAL_STREAM_ANYWHERE_DESC="Moduł Stream Anywhere dla EasySocial. Możesz użyć tego modułu, aby wyświetlić strumień ostatnich aktywności i umożliwić użytkownikom publikowanie aktualizacji bezpośrednio z modułu dla tej konkretnej strony. Pamiętaj, że aby formularz aktualizacji historii działał, potrzebujesz minimalnej szerokości 480 pikseli."
MOD_EASYSOCIAL_STREAM_ANYWHERE_DISPLAY_STORY="Wyświetlaj formularz postów"
MOD_EASYSOCIAL_STREAM_ANYWHERE_DISPLAY_STORY_DESC="Ta opcja określa czy formularz dodawania postów będzie wyświetlany w module. Prosimy pamiętać, iż aby poprawnie wyświetlić formularz musi mieć szerokość min 480 pikseli. "
MOD_EASYSOCIAL_STREAM_ANYWHERE_GOTO_DASHBOARD="Zobacz więcej kanałów na twoim pulpicie"
MOD_EASYSOCIAL_STREAM_ANYWHERE_LOGIN="Zaloguj się aby zobaczyć więcej rzeczy z kanału"
