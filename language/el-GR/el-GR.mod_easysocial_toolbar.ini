MOD_EASYSOCIAL_TOOLBAR_DESC="Αυτή η ενότητα εμφανίζει την ωραία γραμμή εργαλείων ειδοποιήσεων για το EasySocial στον ιστότοπο. Αυτή η ενότητα απαιτεί τουλάχιστον <b> 800px</b> ελάχιστου πλάτους, προκειμένου η γραμμή εργαλείων να ταιριάζει όμορφα."
