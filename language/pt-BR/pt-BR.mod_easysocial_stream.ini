MOD_EASYSOCIAL_STREAM_DESC="Módulo de stream do EasySocial. Você deve usar este módulo para exibir o fluxo de atividades recentes no site, permitindo aos usuários que postem atualizações diretamente do módulo. Atente para o fato de que o formulário de atualização só funcionará se você tiver um mínimo de 480 pixels de largura."
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE="Exibe o Rodapé do Fluxo"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE_DESC="O rodapé exibirá uma mensagem requerendo que o usuário conecte-se para ver mais itens do fluxo."
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Exibe o Formulário de Atualização"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="Esta opção determina se o formulário do histórico deve estar visível no módulo. Ela só deve ser ativada se o módulo possui a largura mínima de 480 pixels."
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY="Filtra por Categoria do Evento"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY_DESC="Esta opção permite a você filtrar os itens do fluxo em uma categoria de evento específica."
MOD_EASYSOCIAL_STREAM_FILTER_BY="Filtra o Fluxo por"
MOD_EASYSOCIAL_STREAM_FILTER_BY_DESC="Apresenta os itens do fluxo por filtros específicos."
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="Ver mais itens do seu painel"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY="Filtra por Categoria de Grupo"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY_DESC="Esta opção permite a você filtrar os itens do fluxo em uma categoria de grupo específica."
MOD_EASYSOCIAL_STREAM_LOGIN="Por favor, faça login para ver mais itens do feed"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY="Filtra por Categoria de Página"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY_DESC="Esta opção permite a você filtrar os itens do stream em uma categoria de página específica."
MOD_EASYSOCIAL_STREAM_TOTAL="Total de Itens"
MOD_EASYSOCIAL_STREAM_TOTAL_DESC="Isto determina o número máximo de itens do fluxo de atividades mostrados no módulo. "
