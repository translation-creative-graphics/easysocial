MOD_EASYSOCIAL_TOOLBAR_DESC="Este módulo exibe no site uma bela barra de ferramenta de notificação do EasySocial. Este módulo requer pelo menos <b>800px</b> de largura mínima para que a barra de ferramenta apareça bem."
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES="Mostrar Em Páginas do EasySocial"
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES_DESC="Se isto estiver desabilitado, o módulo não será visível em páginas do EasySocial."
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION="Colisão da Caixa Popup"
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION_DESC="Vira a posição da caixa do popup quando a posição original ficar cortada pela borda da janela do browser."
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE="Responsivo"
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE_DESC="Se ativado, o módulo irá reajustar a disposição da barra de ferramentas, dependendo da largura do módulo."
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON="Mostrar Ícone de Mensagens"
