MOD_EASYSOCIAL_STREAM_DESC="Module dòng thời gian cho EasySocial. Bạn có thể sử dụng module này để hiển thị các hoạt động gần đây trên dòng thời gian từ website và cho phép người dùng đăng cập nhật trực tiếp từ mô-đun. Hãy lưu ý rằng để biểu mẫu cập nhật câu chuyện hoạt động, bạn cần có chiều rộng tối thiểu 480 pixel."
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE="Hiển thị ghi chú luồng"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE_DESC="Ghi chú cuối trang sẽ hiển thị một thông báo yêu cầu người dùng đăng nhập hoặc đăng ký để xem thêm các luồng danh mục"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Hiển thị mẫu cập nhật"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="Tùy chọn này sẽ quyết định xem biểu mẫu câu chuyện có hiển thị trong mô-đun này không. Điều này chỉ nên được kích hoạt khi mô đun có chiều rộng tối thiểu là 480 pixel"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY="Lọc theo hạng mục sự kiện"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY_DESC="Tùy chọn này cho phép bạn lọc các luồng danh mục theo danh mục sự kiện cụ thể"
MOD_EASYSOCIAL_STREAM_FILTER_BY="Lọc dòng thời gian theo"
MOD_EASYSOCIAL_STREAM_FILTER_BY_DESC="Hiển thị các luồng theo các bộ lọc cụ thể"
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="Xem thêm cập nhật từ bảng điều khiển của bạn"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY="Lọc theo hạng mục nhóm"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY_DESC="Tùy chọn này cho phép bạn lọc các luồng danh mục theo danh mục nhóm cụ thể"
MOD_EASYSOCIAL_STREAM_LOGIN="Hãy đăng nhập để xem thêm nhiều nguồn thông tin nữa."
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY="Lọc theo hạng mục trang"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY_DESC="Tùy chọn này cho phép bạn lọc các luồng danh mục theo danh mục trang cụ thể"
MOD_EASYSOCIAL_STREAM_TOTAL="Tổng số mục"
MOD_EASYSOCIAL_STREAM_TOTAL_DESC="Quyết định số hoạt động lớn nhất của mục dòng thời gian để hiển thị trên mô-đun."
