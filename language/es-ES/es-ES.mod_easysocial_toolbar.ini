MOD_EASYSOCIAL_TOOLBAR_DESC="Este módulo muestra la bonita barra de herramientas de notificación para EasySocial en el sitio. Este módulo requiere al menos <b>800px</b> de ancho mínimo para que la barra de herramientas se ajuste bien."
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES="Mostrar en las Páginas de EasySocial"
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES_DESC="Si esta desactivado, el módulo no será visible en las páginas de EasySocial"
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION="Colisión del cuadro emergente"
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION_DESC="Desplaza la posición del cuadro emergente cuando la posición original se encaja en el borde de la ventana del buscador."
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE="Responsive"
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE_DESC="Si esta habilitado, el módulo ajustará el diseño de la barra de herramientas dependiendo de la anchura del módulo."
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON="Mostrar icono de conversación"
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON_DESC="Si esta habilitado, el módulo mostrará el icono de conversación en la barra de herramientas generada."
MOD_EASYSOCIAL_TOOLBAR_SHOW_FRIENDS_ICON="Mostrar icono de Contactos"
