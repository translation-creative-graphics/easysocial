MOD_EASYSOCIAL_STREAM_DESC="Módulo de flujo para EasySocial. Puede utilizar este módulo para mostrar el flujo de actividades recientes del sitio y permitir a los usuarios publicar actualizaciones directamente desde el módulo. Tenga en cuenta que para la actualización de las historias de forma de trabajar, se necesita un ancho mínimo de 480 píxeles."
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE="Mostrar el pie de página de Stream"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE_DESC="El pie de página mostrará un mensaje solicitando al usuario que inicie sesión o se registre para ver más elementos del stream"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Mostrar actualizaciones desde"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="Esta opción determina si el formulario de historia debe de ser visible en el módulo. Esta opción debe de activarse sólo si el módulo tiene al menos un ancho de 480 pixels"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY="Filtrar por categoría de evento"
