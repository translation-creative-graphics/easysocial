MOD_EASYSOCIAL_TOOLBAR_DESC="Ce module affiche la belle barre d'outils de notification pour EasySocial sur le site. Ce module nécessite au moins <b>800px</b> de largeur minimale pour que la barre d'outils s'adapte bien."
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES="Afficher dans les pages d'EasySocial"
MOD_EASYSOCIAL_TOOLBAR_DISPLAY_ON_EASYSOCIAL_PAGES_DESC="Cet option permet de désactiver ce module dans EasySocial."
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION="Collision de la popbox"
MOD_EASYSOCIAL_TOOLBAR_POPBOX_COLLISION_DESC="Décale la position de la popbox lorsque la position initiale la fait dépasser des limites de la fenêtre du navigateur."
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE="Adaptatif"
MOD_EASYSOCIAL_TOOLBAR_RESPONSIVE_DESC="Cette option permet d'ajuster la barre d'outils en fonction de la taille de la fenêtre."
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON="Afficher l'icône Discussions"
MOD_EASYSOCIAL_TOOLBAR_SHOW_CONVERSATIONS_ICON_DESC="Cette option permet d'afficher une icône Discussions dans la barre d'outils."
MOD_EASYSOCIAL_TOOLBAR_SHOW_FRIENDS_ICON="Afficher l'icône Ajout d'Amis"
MOD_EASYSOCIAL_TOOLBAR_SHOW_FRIENDS_ICON_DESC="Cette option permet d'afficher une icône Ajout d'Amis dans la barre d'outils."
MOD_EASYSOCIAL_TOOLBAR_SHOW_HOME_ICON="Afficher l'icône Home"
MOD_EASYSOCIAL_TOOLBAR_SHOW_HOME_ICON_DESC="Cette option permet d'afficher une icône Home dans la barre d'outils."
MOD_EASYSOCIAL_TOOLBAR_SHOW_LOGIN="Afficher l'icône de Connexion"
MOD_EASYSOCIAL_TOOLBAR_SHOW_LOGIN_DESC="Cette option permet d'afficher une icône permettant de se connecter."
MOD_EASYSOCIAL_TOOLBAR_SHOW_NOTIFICATIONS_ICON="Afficher l'icône Notifications"
MOD_EASYSOCIAL_TOOLBAR_SHOW_NOTIFICATIONS_ICON_DESC="Cette option permet d'afficher une icône Notifications dans la barre d'outils."
MOD_EASYSOCIAL_TOOLBAR_SHOW_PROFILE="Afficher le profil"
