MOD_EASYSOCIAL_STREAM_DESC="Module Stream pour EasySocial. Vous pouvez utiliser ce module pour afficher les flux d'activités récentes du site et permettre aux utilisateurs de publier des mises à jour directement à partir du module. Prenez note que pour la mise à jour de l'histoire forme de travailler, vous avez besoin d'une largeur minimale de 480 pixels."
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE="Afficher le pied de page de flux"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE_DESC="Le pied de page affiche un message demandant à l'utilisateur de se connecter ou de s'inscrire pour afficher plus d'éléments de flux"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Afficher le formulaire de mise à jour"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="Cette option détermine si le formulaire d'historique doit être visible dans le module. Cela ne doit être activé que si le module a une largeur minimale de 480 pixels"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY="Filtrer par Catégorie d'Evénement"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY_DESC="Cette option vous permet de filtrer les éléments de flux par catégorie d'événement spécifique"
MOD_EASYSOCIAL_STREAM_FILTER_BY="Filtrer les Flux Par"
MOD_EASYSOCIAL_STREAM_FILTER_BY_DESC="Rend les flux d'éléments par des filtres spécifiques"
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="Voir plus d'actualités dans votre tableau de bord"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY="Filtrer par Catégorie de Groupe"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY_DESC="Cette option vous permet de filtrer les éléments de flux par catégorie de groupe spécifique"
MOD_EASYSOCIAL_STREAM_LOGIN="Connectez-vous pour en voir plus !"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY="Filtrer par Catégorie de Page"
MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY_DESC="Cette option vous permet de filtrer les éléments de flux par catégorie de page spécifique"
MOD_EASYSOCIAL_STREAM_TOTAL="Total des articles"
MOD_EASYSOCIAL_STREAM_TOTAL_DESC="Indique le nombre maximum d'élément de l'historique à afficher dans ce module."
