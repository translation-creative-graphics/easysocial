; 5.7.1
MOD_ES_GEOMAP_CURRENT_CONTEXT="Only the current page"
MOD_ES_GEOMAP_CURRENT_CONTEXT_DESC="On a CRE8 page, group or event (and its tabs, such as the Map tab) the map shows only what belongs to it: its own pin, its posts, events and marketplace items, and the add-on items linked to it (e.g. the issues of the institution whose page it is). One instance can then serve every page of the same kind. Elsewhere the map shows everything."
