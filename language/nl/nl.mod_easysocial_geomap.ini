MOD_ES_GEOMAP_DESC="Een gelaagde kaart met pagina's, groepen, evenementen, advertenties uit de marktplaats, berichten en gebruikers, voorzien van specifieke markeringen, pictogramfilters en een kaartweergave (of een 'bottom sheet' op mobiele apparaten). Deze kan in elke modulepositie worden geplaatst, ook op pagina's waar geen 'CRE8 Social'-weergave actief is. Websites die gebruikmaken van Google Maps behouden de vertrouwde kaartweergave met gegroepeerde items (clusters)."
MOD_ES_GEOMAP_NOTICE="Kennisgeving:"
MOD_ES_GEOMAP_NOTICE_DESC="Alleen inhoudstypen waarvoor kaartweergave is ingeschakeld via hun eigen instellingentabblad (Inhoudstype > Lay-out > Kaart weergeven) zullen hier verschijnen, zelfs als ze hieronder zijn geselecteerd. Berichten beschikken niet over een dergelijke instelling."
MOD_ES_GEOMAP_TYPE_USER="Gebruikers"
MOD_ES_GEOMAP_COUNT="Maximaal aantal punten (Google Maps)"
