MOD_EASYSOCIAL_STREAM_ANYWHERE_DESC="Модуль Stream Anywhere для EasySocial. Ви можете використовувати цей модуль для відображення стрічки останніх дій і дозволити користувачам публікувати оновлення безпосередньо з модуля для цієї конкретної сторінки. Зверніть увагу, що для роботи форми оновлення історії вам знадобиться мінімальна ширина 480 пікселів."
MOD_EASYSOCIAL_STREAM_ANYWHERE_DISPLAY_STORY="Відобразити форму оновлень"
MOD_EASYSOCIAL_STREAM_ANYWHERE_DISPLAY_STORY_DESC="Цей параметр визначає, чи повинна форма історії бути видимою в модулі. Може бути увімкнено тільки якщо мінімальна ширина модуля становить 480 пікселів"
MOD_EASYSOCIAL_STREAM_ANYWHERE_GOTO_DASHBOARD="Переглянути більше каналів на своїй інформаційній панелі"
MOD_EASYSOCIAL_STREAM_ANYWHERE_LOGIN="Будь ласка, увійдіть до системи, щоб переглянути більше елементів каналу"
MOD_EASYSOCIAL_STREAM_ANYWHERE_TOTAL="Всього елементів"
MOD_EASYSOCIAL_STREAM_ANYWHERE_TOTAL_DESC="Визначає максимальну кількість елементів стрічки для відображення в модулі."
