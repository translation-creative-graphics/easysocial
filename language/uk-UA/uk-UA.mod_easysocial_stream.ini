MOD_EASYSOCIAL_STREAM_DESC="Модуль Stream для EasySocial. Ви можете використовувати цей модуль для відображення стрічки останніх дій і дозволити користувачам публікувати оновлення безпосередньо з модуля для цієї конкретної сторінки. Зверніть увагу, що для роботи форми оновлення історії вам знадобиться мінімальна ширина 480 пікселів."
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE="Відобразити нижній колонтитул стрічки"
MOD_EASYSOCIAL_STREAM_DISPLAY_FOOTER_MESSAGE_DESC="У нижньому колонтитулі буде відображатися повідомлення, в якому пропонується користувачеві увійти до системи чи зареєструватися, щоб переглянути більше елементів стрічки"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Відобразити форму оновлень"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="Цей параметр визначає, чи повинна форма історії бути видимою в модулі. Може бути увімкнено тільки якщо мінімальна ширина модуля становить 480 пікселів"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY="Фільтрувати за категорією заходу"
MOD_EASYSOCIAL_STREAM_EVENT_CATEGORY_DESC="Цей параметр дозволяє фільтрувати елементи стрічки за конкретною категорією заходу"
MOD_EASYSOCIAL_STREAM_FILTER_BY="Фільтрувати стрічки за"
MOD_EASYSOCIAL_STREAM_FILTER_BY_DESC="Візуалізує елементи стрічки відповідно до певних фільтрів"
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="Переглянути більше каналів на своїй інформаційній панелі"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY="Фільтрувати за категорією групи"
MOD_EASYSOCIAL_STREAM_GROUP_CATEGORY_DESC="Цей параметр дозволяє фільтрувати елементи стрічки за конкретною категорією групи"
MOD_EASYSOCIAL_STREAM_LOGIN="Будь ласка, увійдіть до системи, щоб переглянути більше елементів каналу"
