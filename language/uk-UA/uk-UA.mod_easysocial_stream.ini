MOD_EASYSOCIAL_STREAM_PAGE_CATEGORY_DESC="Цей параметр дозволяє фільтрувати елементи стрічки за конкретною категорією сторінки"
MOD_EASYSOCIAL_STREAM_TOTAL="Всього елементів"
