MOD_EASYSOCIAL_STREAM_DESC="EasySocial Hírfolyam modul. A modult azért hoztuk létre, hogy megjelenítsd a Hírfolyam legutóbbi tevékenységeit az oldalon, valamint így felhasználóid bejegyzéseket tehetnek közzé közvetlenül a modulból. Kérjük vedd figyelembe azonban, hogy a modul működéséhez 480 pixel minimális szélességre van szükség."
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY="Sharebox megjelenítése"
MOD_EASYSOCIAL_STREAM_DISPLAY_STORY_DESC="A beállítás meghatározza az üzenőfali megosztáshoz használható mező (sharebox) láthatóságát a modulon belül. Ezt csak akkor szabad engedélyezni, ha a modul minimális szélessége eléri a 480 képpontot."
MOD_EASYSOCIAL_STREAM_GOTO_DASHBOARD="További hírek megtekintése a Vezérlőpultról"
MOD_EASYSOCIAL_STREAM_LOGIN="További hírfolyam bejegyzések megtekintéséhez kérjük, jelentkezz be"
MOD_EASYSOCIAL_STREAM_TOTAL="Összes elem"
MOD_EASYSOCIAL_STREAM_TOTAL_DESC="Ez a beállítás meghatározza a modul által megjelenített hírfolyam bejegyzések maximális számát."
