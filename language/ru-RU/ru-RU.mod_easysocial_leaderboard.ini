MOD_EASYSOCIAL_LEADERBOARD_DESC="Это EasySocial модуль, который отображает список лидеров среди пользователей сайта."
MOD_EASYSOCIAL_LEADERBOARD_EXCLUDE_ESAD="Показать только пользователей, которые имеют доступ к сообществу."
MOD_EASYSOCIAL_LEADERBOARD_EXCLUDE_ESAD_DESC="Если этот параметр включен, пользователи, не имеющие доступа к сообществу, будут удалены из списка лидеров."
MOD_EASYSOCIAL_LEADERBOARD_RECENT_DAYS="На основании последних дней"
MOD_EASYSOCIAL_LEADERBOARD_RECENT_DAYS_DESC="Если указано, то таблица лидеров по заработанным очкам будет основана на последних \"_QQ_\"x\"_QQ_\" днях. Введите 0 для отображения списка лидеров на основе поведения по умолчанию."
MOD_EASYSOCIAL_LEADERBOARD_SHOW_ALL_LINK="Отобразить лидеров"
MOD_EASYSOCIAL_LEADERBOARD_SHOW_ALL_LINK_DESC="Если эта опция будет включена, то ссылка будет выведена на экран у основания модуля, который соединяется со страницей списка лидеров."
MOD_EASYSOCIAL_LEADERBOARD_SHOW_TOOLTIP="Показывать подсказки"
MOD_EASYSOCIAL_LEADERBOARD_SHOW_TOOLTIP_DESC="Если эта опция включена, то большая подсказка о пользователе будет выведена на экран, при наведении на имя автора."
MOD_EASYSOCIAL_LEADERBOARD_TOOLTIP_POSITION="Подсказка позиции"
MOD_EASYSOCIAL_LEADERBOARD_TOOLTIP_POSITION_DESC="Будет отображена позиция, в виде подсказки, рядом с аватаром пользователя."
MOD_EASYSOCIAL_LEADERBOARD_TOTAL_USERS="Всего пользователей"
MOD_EASYSOCIAL_LEADERBOARD_TOTAL_USERS_DESC="Определяет сколько пользователей выводить на экран в этом модуле."
MOD_EASYSOCIAL_LEADERBOARD_USER_POINTS="%1s <span>Баллы</span>"
MOD_EASYSOCIAL_LEADERBOARD_VIEW_LEADERBOARD="Посмотреть лидеров"
